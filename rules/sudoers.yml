# sudoers 授权基线
rules:
  - id: SUDO-001
    title: 禁止 NOPASSWD 配合 ALL 命令
    component: sudoers
    severity: high
    tags: [等保-8.1.3.1, 身份鉴别, 最小授权]
    fact: sudoers.rules
    args: { tags: [NOPASSWD] }
    pass_when: { kind: no_nopasswd_all }
    match_policy: all
    on_empty: pass
    rationale: NOPASSWD: ALL 使该账户切换/执行任意命令无需口令,
      一旦账户失陷等于直接交出 root。
    remediation: |
      visudo 删除形如:
        user ALL=(ALL) NOPASSWD: ALL
      改为按需授权的具体命令路径,并保留口令校验。
    references: [CIS 5.3.10]

  - id: SUDO-002
    title: 禁止以 ALL 身份运行且命令为 ALL 的过宽授权
    component: sudoers
    severity: high
    tags: [等保-8.1.4.2, 最小授权]
    fact: sudoers.rules
    args: { command: "ALL" }
    pass_when: { kind: runas_not_all }
    match_policy: all
    on_empty: pass
    rationale: user ALL=(ALL) ALL 等于无限制 root 权限,应限定 runas 与命令。
    remediation: 将 (ALL) 收窄为具体服务账户,命令改为绝对路径清单。

  - id: SUDO-003
    title: sudoers 中禁止通配符命令
    component: sudoers
    severity: medium
    tags: [等保-8.1.4.2, 最小授权]
    fact: sudoers.rules
    args: {}
    pass_when: { kind: no_wildcard_command }
    match_policy: all
    on_empty: pass
    rationale: 通配符命令常可被参数构造绕过(如 /bin/vim /etc/* 可编辑任意文件)。
    remediation: 用完整命令路径替代通配符,必要时配合 sudoers 参数白名单。

  - id: SUDO-004
    title: 启用 sudo 日志记录
    component: sudoers
    severity: medium
    tags: [等保-8.1.4.3, 安全审计]
    fact: sudoers.defaults
    args: { key: logfile }
    operator: exists
    on_empty: fail
    rationale: 等保要求对特权操作进行审计,sudo 操作必须留痕。
    remediation: |
      visudo 增加:
        Defaults logfile="/var/log/sudo.log"
    references: [CIS 5.3.7]

  - id: SUDO-005
    title: 关闭 sudo 的 setenv 环境变量透传
    component: sudoers
    severity: medium
    tags: [最小化]
    fact: sudoers.defaults
    args: { key: env_reset }
    operator: exists
    on_empty: pass
    rationale: env_reset 保证命令在干净环境运行,防止 LD_PRELOAD 等注入。
    remediation: "visudo: Defaults env_reset"

  - id: SUDO-006
    title: 自定义 tty 要求(sudo 必须在终端中运行)
    component: sudoers
    severity: low
    fact: sudoers.defaults
    args: { key: requiretty }
    operator: exists
    on_empty: pass
    rationale: 部分自动化场景会冲突,作为低危加固建议。
    remediation: "visudo: Defaults requiretty"

  - id: SUDO-007
    title: sudo 会话超时不超过 15 分钟
    component: sudoers
    severity: low
    fact: sudoers.defaults
    args: { key: timestamp_timeout }
    operator: le
    expected: 15
    on_empty: pass
    rationale: timestamp_timeout 过长会让离开工位的 sudo 缓存被他人利用。
    remediation: "visudo: Defaults timestamp_timeout=10"
