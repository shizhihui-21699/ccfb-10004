# /etc/login.defs 口令与账户策略基线
rules:
  - id: LOGIN-001
    title: 口令最长使用期限不超过 90 天
    component: login_defs
    severity: high
    tags: [等保-8.1.3.1, 口令有效期]
    fact: login_defs.setting
    args: { key: PASS_MAX_DAYS }
    operator: le
    expected: 90
    on_empty: fail
    rationale: 等保要求口令定期更换。
    remediation: "/etc/login.defs: PASS_MAX_DAYS 90"
    references: [CIS 5.5.1.1]

  - id: LOGIN-002
    title: 口令最小长度不小于 8
    component: login_defs
    severity: high
    tags: [等保-8.1.3.1, 口令复杂度]
    fact: login_defs.setting
    args: { key: PASS_MIN_LEN }
    operator: ge
    expected: 8
    on_empty: fail
    rationale: 短口令易被字典/暴力破解。
    remediation: "/etc/login.defs: PASS_MIN_LEN 8"
    references: [CIS 5.5.1.2]

  - id: LOGIN-003
    title: 口令修改最小间隔不少于 1 天
    component: login_defs
    severity: low
    fact: login_defs.setting
    args: { key: PASS_MIN_DAYS }
    operator: ge
    expected: 1
    on_empty: fail
    remediation: "/etc/login.defs: PASS_MIN_DAYS 1"
    references: [CIS 5.5.1.3]

  - id: LOGIN-004
    title: 口令到期警告提前期不少于 7 天
    component: login_defs
    severity: low
    fact: login_defs.setting
    args: { key: PASS_WARN_AGE }
    operator: ge
    expected: 7
    on_empty: fail
    remediation: "/etc/login.defs: PASS_WARN_AGE 7"
    references: [CIS 5.5.1.4]

  - id: LOGIN-005
    title: 自动退出空闲终端(UMASK 之外的超时控制)
    component: login_defs
    severity: medium
    tags: [等保-8.1.3.4, 会话超时]
    fact: login_defs.setting
    args: { key: TMOUT }
    operator: le
    expected: 900
    on_empty: fail
    rationale: TMOUT 控制 shell 空闲自动退出,等保要求会话超时锁定/终止。
    remediation: |
      /etc/login.defs 或 /etc/profile.d/autologout.sh:
        TMOUT=900; readonly TMOUT; export TMOUT

  - id: LOGIN-006
    title: 默认 UMASK 不宽松于 027
    component: login_defs
    severity: medium
    tags: [等保-8.1.4.4, 资源控制]
    fact: login_defs.setting
    args: { key: UMASK }
    operator: in
    expected: ["027", "077", "022"]
    on_empty: fail
    rationale: 022 是常见合规下限;027/077 更严。出现 000 即高风险。
    remediation: "/etc/login.defs: UMASK 027"

  - id: LOGIN-007
    title: 禁止 root 之外的 UID 0 账户(通过 login.defs 旁路口令策略检测)
    component: login_defs
    severity: low
    fact: login_defs.setting
    args: { key: ENCRYPT_METHOD }
    operator: in
    expected: [SHA512, YESCRYPT]
    on_empty: fail
    rationale: 旧系统可能仍是 MD5/DES,需确认哈希算法。
    remediation: "/etc/login.defs: ENCRYPT_METHOD SHA512"

  - id: LOGIN-008
    title: 关闭无密码账户的 su 回退(FAIL_DELAY 配置)
    component: login_defs
    severity: low
    fact: login_defs.setting
    args: { key: FAIL_DELAY }
    operator: ge
    expected: 3
    on_empty: pass
    remediation: "/etc/login.defs: FAIL_DELAY 4"
